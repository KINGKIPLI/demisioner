<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FFFFFF',
                        ink: '#000000',
                        accent1: '#FF3366',
                        accent2: '#FFD600'

                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['"DM Sans"', 'sans-serif'],
                    },
                    boxShadow: {
                        'brutal': '6px 6px 0px #000000',

    <style>
        /* Base Resets for Brutalism */
        * { border-radius: 0 !important; }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #FFFFFF; border-left: 2px solid #000000; }
        ::-webkit-scrollbar-thumb { background: #FF3366; border: 2px solid #000000; }
    </style>
</head>
<body class="font-body text-ink min-h-screen p-2 md:p-6 lg:p-8">

    <!-- Background Audio -->

                    DEMISIONER<br>KETOS<br>25-26
                </h1>
            </div>
            <div class="p-6 md:p-12 lg:w-1/3 flex flex-col justify-center bg-paper">
                <p class="font-display text-2xl mb-4 text-accent2" style="-webkit-text-stroke: 1px #000000;">SMKN 1 JAKARTA</p>
                <p class="font-body font-bold text-lg border-2 border-ink p-4 bg-paper shadow-brutal-sm">
                    STATUS: AKTIF MENCARI GOMBALAN

        </header>

        <!-- Gallery Grid -->

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 md:gap-8">
                
                <!-- Card 1 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"

                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent2 text-ink font-bold">FILE_01.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.20.18 (1).jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 1">
                    </div>
                </article>

                <!-- Card 2 -->

                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent1 text-paper font-bold">FILE_02.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.39.20.jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 2">
                    </div>
                </article>

                <!-- Card 3 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"
                         onclick="openModal('WhatsApp Image 2026-11-03 at 19.20.18.jpeg', 'Ketos paling berwibawa. Tapi kalau senyum begini, wibawaku yang runtuh.')">
                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent2 text-ink font-bold">FILE_03.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.20.18.jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 3">
                    </div>
                </article>

                <!-- Card 4 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"
                         onclick="openModal('WhatsApp Image 2026-11-03 at 19.20.19 (1).jpeg', 'Gaya sudah seperti model papan atas. Pantas menjadi pusat perhatian SMKN 1.')">
                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent1 text-paper font-bold">FILE_04.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.20.19 (1).jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 4">
                    </div>

                <!-- Card 5 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"

                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent2 text-ink font-bold">FILE_05.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.20.19 (2).jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 5">

                    </div>
                </article>

                <!-- Card 7 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"

                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent2 text-ink font-bold">FILE_07.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.39.19.jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 7">
                    </div>
                </article>

                <!-- Card 8 -->
                <article class="group cursor-pointer border-4 border-ink bg-paper shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px] transition-all flex flex-col"
                         onclick="openModal('WhatsApp Image 2026-11-03 at 19.20.20.jpeg', 'Ekspresi galak saat menagih kas. Tapi anehnya tetap membuat kangen.')">
                    <div class="border-b-4 border-ink p-2 font-display text-sm bg-accent1 text-paper font-bold">FILE_08.JPG</div>
                    <div class="aspect-[3/4] w-full overflow-hidden bg-ink">
                        <img src="WhatsApp Image 2026-11-03 at 19.20.20.jpeg" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-300" alt="Archive 8">
                    </div>
                </article>

            </div>
        </main>
    </div>

    <!-- Brutalist Modal -->
    <div id="brutal-modal" class="fixed inset-0 z-[100] hidden bg-paper border-[12px] md:border-[24px] border-ink flex flex-col lg:flex-row overflow-y-auto">
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 lg:top-8 lg:right-8 z-10 bg-ink text-paper font-display text-xl md:text-2xl px-6 py-4 hover:bg-accent1 hover:text-paper border-4 border-ink transition-colors shadow-brutal hover:shadow-none hover:translate-x-[6px] hover:translate-y-[6px]">
            TUTUP [X]
        </button>

        <!-- Left/Top: Image -->
        <div class="w-full lg:w-1/2 min-h-[50vh] p-6 lg:p-12 flex items-center justify-center border-b-[8px] lg:border-b-0 lg:border-r-[8px] border-ink bg-accent2">
            <div class="border-8 border-ink bg-paper shadow-brutal w-full max-w-md aspect-[3/4]">
                <img id="modal-img" src="" class="w-full h-full object-cover" alt="Selected Archive">
            </div>
        </div>

        <!-- Right/Bottom: Text -->
        <div class="w-full lg:w-1/2 p-6 lg:p-12 flex flex-col justify-center bg-paper">
            <h4 class="font-body text-xl font-bold mb-6 uppercase tracking-widest text-accent1 border-b-4 border-ink pb-4">PESAN TERDEKRIPSI:</h4>
            <p id="modal-text" class="font-display text-3xl md:text-5xl lg:text-6xl uppercase leading-[1.1] tracking-tighter text-ink" style="word-break: keep-all;">
                <!-- Gombalan text injected here via JS -->
            </p>
        </div>
    </div>

    <script>
        // Gate & Audio Logic
        function unlockArchive() {
            const gate = document.getElementById('gate-overlay');
            const mainContent = document.getElementById('main-content');
            const audio = document.getElementById('bg-audio');

            // Try to play audio
            audio.volume = 0.5; // Set volume to 50%
            audio.play().catch(error => {
                console.log("Audio play failed/blocked:", error);
            });

            // Slide up the gate
            gate.style.transform = 'translateY(-100%)';
            
            // Fade in content
            setTimeout(() => {
                mainContent.style.opacity = '1';
                // Completely hide gate after transition
                setTimeout(() => {
                    gate.style.display = 'none';
                }, 500);
            }, 300);
        }

        // Modal Logic
        const modal = document.getElementById('brutal-modal');
        const modalImg = document.getElementById('modal-img');
        const modalText = document.getElementById('modal-text');
        
        // Prevent background scrolling when modal is open
        function openModal(imgSrc, gombalan) {
            modalImg.src = imgSrc;
            modalText.innerText = `"${gombalan}"`;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            // Slight delay to clear content
            setTimeout(() => {
                modalImg.src = '';
                modalText.innerText = '';
            }, 300);
        }
    </script>
</body>
</html>
